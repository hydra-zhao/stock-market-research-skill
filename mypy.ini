# v7.2.13d P2 engineering baseline: incremental type checking (mypy).
# NOTE: keep this file pure ASCII -- configparser/mypy reads it with the system
# locale encoding on Windows (GBK) unless PYTHONUTF8 is set; non-ASCII comments
# broke the documented command on a plain PowerShell (v7.2.13d audit, P2-1).
# Scope: core modules first (common.paths/timing, daywatch_plan, daywatch_run,
# seat_profile, review_hooks, daily_journal); non-strict mode -- catch obvious
# type mismatches only; new code is written annotated from the start.
# Run (from repo root):
#   cd data && python -m mypy --config-file ../mypy.ini daywatch_plan.py ^
#       daywatch_run.py seat_profile.py review_hooks.py common/paths.py ^
#       common/timing.py daily_journal.py
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (output|journals|tactics/\.archive|\.mimosa)

[mypy-daywatch_leaders.*]
follow_imports = skip
